# Publishes the user guide (website/, 02 §3) to GitHub Pages at https://actualitydesktop.org (02 §5.1).
# Needs Settings ▸ Pages ▸ Source set to "GitHub Actions". The custom domain is set on that page too:
# a Pages site deployed from a workflow ignores a CNAME file, so the site has none.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The site serves the app's icons from here (staticDirectories in docusaurus.config.ts).
      - 'resources/icons/svg/**'
      - '.nvmrc'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer one waits rather than cancelling a deployment partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
