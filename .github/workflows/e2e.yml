# E2E on the built app: nightly and before release (02 §5.1, 21 §1).
# Full suite on Linux; smoke tests on Windows and macOS.
name: E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            grep: ''
          - os: windows-latest
            grep: '@smoke'
          - os: macos-latest
            grep: '@smoke'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the Actual test server (journeys, 21 §3)
        if: runner.os == 'Linux'
        run: docker compose -f tests/int/docker-compose.yml up -d --wait
      - name: E2E (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          ACTUAL_TEST_SERVER_URL: http://localhost:5006
          ACTUAL_TEST_PASSWORD: integration-test
          ACTUAL_TEST_BOOTSTRAP: '1'
      - name: E2E smoke
        if: runner.os != 'Linux'
        run: npm run test:e2e -- --grep "${{ matrix.grep }}"
      - name: Stop the test server
        if: always() && runner.os == 'Linux'
        run: docker compose -f tests/int/docker-compose.yml down -v
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report
