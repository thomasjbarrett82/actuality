# CI (02 §5.1). check runs first; test, integration, build and website follow in parallel. On a release
# merge to main (opened by release.yml), e2e runs too, and then release tags the commit and drafts its
# GitHub release with the installers from build.
name: CI

# Branch pushes only: a tag push would start a second full run for the same commit.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A run on main is never cancelled partway through, so a release run always gets to tag its commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Release merge
        id: release
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore: release v')
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$MESSAGE" in
            "chore: release v$VERSION"*) echo "version=$VERSION" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The release commit doesn't name package.json's version ($VERSION)"; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run check
      - name: Commit messages (pull requests)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Spec, user guide and UI strings in step (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run docs:sync -- ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint --verbose

  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  integration:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported server (21 §7) and the latest release.
        server: ['26.2.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the Actual test server
        run: docker compose -f tests/int/docker-compose.yml up -d --wait
        env:
          ACTUAL_SERVER_VERSION: ${{ matrix.server }}
      - run: npm run test:int
        env:
          ACTUAL_TEST_SERVER_URL: http://localhost:5006
          ACTUAL_TEST_PASSWORD: integration-test
          ACTUAL_TEST_BOOTSTRAP: '1'
      - name: Stop the test server
        if: always()
        run: docker compose -f tests/int/docker-compose.yml down -v

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # SignPath downloads the installers to sign from this run's artifacts with the job's token.
      actions: read
    env:
      # Windows Authenticode through SignPath Foundation (02 §5): on a release merge, once the repository
      # has the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret. Other builds are unsigned.
      SIGN_WINDOWS: >-
        ${{ matrix.os == 'windows-latest' && needs.check.outputs.release-version != '' &&
        vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        # A secret that isn't set still arrives as an empty variable, and electron-builder reads an empty
        # CSC_LINK as a path (the working directory). Unset the empty ones, so builds without signing
        # secrets are simply unsigned. CSC_LINK is the macOS certificate: Windows signing is SignPath's, after
        # packaging, so electron-builder must not try the Apple certificate on Windows.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ "$RUNNER_OS" = Windows ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npm run package -- --publish never
        env:
          # Code signing and notarization use repository secrets when present (02 §5).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      # SignPath signs the two installers (the artifact configuration is in .signpath/), after an approver
      # approves the signing request in SignPath, so the job waits up to an hour for that. The signed
      # installers replace the unsigned ones in release/, so the uploads below pick them up.
      - name: Upload the Windows installers for signing
        id: unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installers
          path: release/*-Windows-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Sign the Windows installers (SignPath)
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: actuality
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.check.outputs.release-version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed
      - name: Check the signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem release/signed -Filter '*-Windows-*.exe')
          if ($signed.Count -ne 2) { throw "Expected 2 signed installers, found $($signed.Count)" }
          foreach ($f in $signed) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              throw "$($f.Name): signature $($sig.Status), timestamped: $([bool]$sig.TimeStamperCertificate)"
            }
            "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
            Move-Item -Force $f.FullName release/
          }
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: installer-windows-x64
          path: release/*-Windows-*-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: installer-windows-arm64
          path: release/*-Windows-*-arm64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          name: installer-macos-x64-dmg
          path: release/*-macOS-*-x64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          name: installer-macos-x64-zip
          path: release/*-macOS-*-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          name: installer-macos-arm64-dmg
          path: release/*-macOS-*-arm64.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          name: installer-macos-arm64-zip
          path: release/*-macOS-*-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-x64-appimage
          path: release/*-Linux-*-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-x64-deb
          path: release/*-Linux-*-amd64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-x64-rpm
          path: release/*-Linux-*-x86_64.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-arm64-appimage
          path: release/*-Linux-*-arm64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-arm64-deb
          path: release/*-Linux-*-arm64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: installer-linux-arm64-rpm
          path: release/*-Linux-*-aarch64.rpm
          if-no-files-found: error

  # E2E before a release (21 §1), on the release merge only.
  e2e:
    needs: check
    if: needs.check.outputs.release-version
    uses: ./.github/workflows/e2e.yml

  # A release merge: tag the commit and draft its GitHub release with the installers from build. Safe to
  # re-run: an existing tag on this commit and an existing release are reused.
  release:
    needs: [check, test, integration, build, website, e2e]
    if: needs.check.outputs.release-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.release-version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: `prepare` would install the git hooks, and nothing here runs the app.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      # Twelve installer-* uploads in the build job: change both together.
      - name: Check the installers
        run: |
          count=$(find installers -type f | wc -l)
          if [ "$count" -ne 12 ]; then
            echo "::error::Expected 12 installers (2 Windows, 4 macOS, 6 Linux), found $count"
            ls -la installers
            exit 1
          fi
      # The release page is where people download, so it links the code signing policy (SignPath Foundation's
      # terms ask for it on the download page).
      - name: Write the release notes
        run: |
          npx tsx scripts/release-notes.ts "$VERSION" > notes.md
          printf '\n---\n\n[Code signing policy](https://actualitydesktop.org/code-signing-policy)\n' >> notes.md
      - name: Tag the release commit
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            if [ "$(git rev-list -n 1 "v$VERSION")" != "$GITHUB_SHA" ]; then
              echo "::error::v$VERSION already exists on another commit"
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "v$VERSION" -m "Actuality $VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
      - name: Draft the GitHub release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" installers/* --clobber
          else
            gh release create "v$VERSION" installers/* --draft --verify-tag \
              --title "Actuality $VERSION" --notes-file notes.md
          fi
          echo "Draft release v$VERSION is ready: finish the release checklist, then publish it." >> "$GITHUB_STEP_SUMMARY"

  # The user guide site (website/, 02 §3): its own lockfile, typecheck and Docusaurus build. Broken links
  # and anchors fail the build. Deploying it is a separate workflow.
  website:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
