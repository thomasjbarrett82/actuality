# electron-builder (02 §5). Run `npm run build` first; `npm run package` builds installers for the current OS.
appId: com.actuality.app # placeholder; same as APP_ID in src/shared/app.ts
productName: Actuality
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
# better-sqlite3's N-API binary must load from outside the asar archive.
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
  # About ▸ View licenses opens it with the OS, which can't read inside the archive (18 §1).
  - out/THIRD-PARTY-LICENSES.txt
# Prebuilt N-API binaries only: never compile native code.
npmRebuild: false
nodeGypRebuild: false

win:
  icon: icons/windows/actuality.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  files:
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.finance
  icon: icons/macos/actuality.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true # credentials come from CI secrets (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER)
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  files:
    - '!node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*.node'

linux:
  category: Office
  # One PNG, installed as-is. A folder would need flat {size}x{size}.png names, not the hicolor tree.
  icon: icons/png/actuality-icon-512.png
  # Matches desktopName in package.json, so desktops link the running window to its launcher entry.
  syncDesktopName: true
  # The .deb and .rpm maintainer comes from package.json author.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  files:
    - '!node_modules/better-sqlite3/prebuilds/{win32,darwin}-*.node'
    # The window icon (src/main/window.ts): electron-vite's ?asset links files under resources/ in place.
    - resources/icons/png/actuality-icon-512.png

# Auto-update is out of scope (D8); the publish config stays ready.
publish:
  provider: github
  releaseType: draft
